version: '3.9'

services:
  # Meshtastic Mesh Monitor - Collects data from radio
  mesh-monitor:
    build:
      context: ./meshtastic_mesh_monitor
      dockerfile: docker/Dockerfile
    image: meshtastic_mesh_monitor:latest
    container_name: meshtastic_mesh_monitor
    restart: unless-stopped
    
    environment:
      # Radio connection configuration
      - TCP_SERVER=${RADIO_IP:-192.168.68.73}
      - TCP_PORT=${RADIO_PORT:-4403}
      
      # API configuration (from .env - never hardcoded!)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Data file location (shared with visualizer)
      - MESH_DATA_FILE=/data/mesh_data.json
      
      # Application settings
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # Only expose port for external device connections, if needed
    ports:
      - ${RADIO_PORT_EXPOSE:-127.0.0.1:4403:4403}
    
    volumes:
      # Shared data volume between services
      - mesh_data:/data
      # Configuration
      - ./meshtastic_mesh_monitor/config:/app/config_files:ro
      # Logs
      - mesh_monitor_logs:/app/logs
    
    # Resource limits
    mem_limit: 512M
    memswap_limit: 512M
    cpus: '0.5'
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    
    # Network
    networks:
      - mesh-network
    
    # Health check - verify database connection
    healthcheck:
      test: ['CMD', 'python3', '-c', 'import sqlite3; sqlite3("/data/mesh.db").execute("SELECT 1")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Meshtastic Mesh Visualizer - Web UI
  mesh-visualizer:
    build:
      context: ./meshtastic_mesh_visualizer
      dockerfile: docker/Dockerfile
    image: meshtastic_mesh_visualizer:latest
    container_name: meshtastic_mesh_visualizer
    restart: unless-stopped
    
    # IMPORTANT: Wait for monitor to be healthy
    depends_on:
      mesh-monitor:
        condition: service_healthy
    
    environment:
      # Flask configuration
      - FLASK_ENV=production
      - FLASK_APP=app.py
      
      # Data file location (read from monitor)
      - MESH_DATA_FILE=/data/mesh_data.json
      
      # Application settings
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # Web UI port
    ports:
      - '${VISUALIZER_PORT:-5000}:5000'
    
    volumes:
      # Read mesh data from monitor (read-only)
      - mesh_data:/data:ro
      # Logs
      - mesh_visualizer_logs:/app/logs
    
    # Resource limits
    mem_limit: 512M
    memswap_limit: 512M
    cpus: '0.5'
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    
    # Network
    networks:
      - mesh-network
    
    # Health check - verify Flask is responding
    healthcheck:
      test: ['CMD', 'python', '-c', 'import requests; requests.get("http://localhost:5000/", timeout=5)']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes for persistent data
volumes:
  mesh_data:
    driver: local
  mesh_monitor_logs:
    driver: local
  mesh_visualizer_logs:
    driver: local

# Network for service-to-service communication
networks:
  mesh-network:
    driver: bridge
